<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baton · Pairing</title>
<style>
  :root { --ink:#17161a; --ink-2:#211f24; --line:#34313a; --paper:#efe9dd; --paper-2:#a7a19a; --brass:#c99a3b; --brass-ink:#1d160a; --alert:#e0674f; --done:#7fae7a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--ink); color:var(--paper); font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  form { width: 460px; }
  h1 { margin:0 0 6px; font-size:22px; font-weight:650; letter-spacing:-0.01em; }
  p { color:var(--paper-2); margin:0 0 24px; }
  label { display:block; font-size:12.5px; color:var(--paper-2); margin:16px 0 6px; }
  input { width:100%; font:14px inherit; font-family:inherit; letter-spacing:0.02em; padding:9px 11px; border-radius:7px; border:1px solid var(--line); background:var(--ink-2); color:var(--paper); }
  input:focus { outline:none; border-color:var(--brass); }
  button { margin-top:20px; font:600 14px inherit; font-family:inherit; padding:8px 18px; border:0; border-radius:7px; background:var(--brass); color:var(--brass-ink); cursor:pointer; }
  button:hover { background:#d6a847; }
  #status { margin-top:24px; padding-top:16px; border-top:1px solid var(--line); }
  #status[data-status=connected] { color:var(--done); }
  #status[data-status=rejected] { color:var(--alert); }
  #detail { color:var(--paper-2); font-size:12.5px; margin-top:4px; }
</style>
</head>
<body>
<form id="form">
  <h1>Pair Chrome with Baton</h1>
  <p>In the Baton app, click “Pair Chrome” on the Podium and copy the token. Paste it here once.</p>
  <label for="token">Pairing token</label>
  <input id="token" autocomplete="off" spellcheck="false" placeholder="43 characters">
  <label for="port">Port</label>
  <input id="port" inputmode="numeric" value="4317">
  <button>Save</button>
  <div id="status"></div>
  <div id="detail"></div>
</form>
<script src="options.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baton · Pairing</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d14;color:#e8eaf2;font:15px/1.5 "Inter","Segoe UI",system-ui,sans-serif}
  .card{width:520px;padding:32px 36px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  h1{margin:0 0 6px;font-size:24px}
  p{color:#9aa1b5;margin:0 0 20px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:#c6cad8}
  input{width:100%;box-sizing:border-box;font:14px ui-monospace,Consolas,monospace;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#141826;color:#fff}
  button{margin-top:20px;font:600 15px inherit;font-family:inherit;padding:10px 22px;border:0;border-radius:10px;background:#7c8cff;color:#0b0d14;cursor:pointer}
  #status{margin-top:22px;padding:10px 14px;border-radius:10px;background:#141826}
  #status[data-status=connected]{color:#5eead4}
  #status[data-status=rejected]{color:#fda4af}
  #detail{color:#9aa1b5;font-size:13px;margin-top:6px}
</style>
</head>
<body>
<form class="card" id="form">
  <h1>Pair with Baton</h1>
  <p>Open the Baton app, choose “Pairing token” from its tray menu, and paste the token here. You only do this once.</p>
  <label for="token">Pairing token</label>
  <input id="token" autocomplete="off" spellcheck="false" placeholder="43 characters">
  <label for="port">Port</label>
  <input id="port" inputmode="numeric" value="4317">
  <button>Save</button>
  <div id="status"></div>
  <div id="detail"></div>
</form>
<script src="options.js"></script>
</body>
</html>
